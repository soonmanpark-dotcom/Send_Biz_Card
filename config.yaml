card:
  name: "박순만 / Soonmahn Park"
  # 이름 아래에 한 줄씩 표시된다. 줄을 늘리거나 줄이려면 이 목록만 고치면 된다.
  lines:
    - "연세대학교 의과대학 대학원" 
    - "의료기기산업학과 부교수"
    - "서울시 강남구 언주로63길 20 미래의학연구센터"
    - "강남세브란스병원 교수연구동 지하 1층"
  # 사진 주소. 비워두면 사진 없이 지금처럼 표시된다.
  # static/ 폴더에 파일을 올린 뒤 아래 줄의 주석(#)을 지우면 적용된다.
  # 명함 이미지 한 장으로 보여주려면 여기에 주소를 넣는다.
  # 값이 있으면 아래 name/lines/photo 설정 대신 이 이미지가 표시된다.
  card_image_url: "https://send-biz-card.onrender.com/static/namecard.png"
  photo_url: "https://send-biz-card.onrender.com/static/profile.jpg"
  photo_size: 72
  # 사진 배치: stack(사진 위·글자 아래) / compact(사진 옆 이름만) / side(사진 옆 전부)
  photo_layout: "compact"
  kakao_id: "soonman22"
  homepage: "https://stirring-elf.netlify.app/"

gmail:
  sender_address: "soonman.park@gmail.com"
  app_password: ""  # 환경변수 GMAIL_APP_PASSWORD 로 설정

# Gmail API 로 보내면 보낸사람이 실제 Gmail 주소로 표시된다(중계 서비스 주소가 아님).
# 세 값이 모두 채워지면 Brevo 대신 Gmail API 를 사용한다.
gmail_api:
  client_id: ""      # 환경변수 GOOGLE_CLIENT_ID
  client_secret: ""  # 환경변수 GOOGLE_CLIENT_SECRET
  refresh_token: ""  # 환경변수 GOOGLE_REFRESH_TOKEN
  redirect_uri: "https://send-biz-card.onrender.com/oauth/callback"

brevo:
  api_key: ""  # 환경변수 BREVO_API_KEY 로 설정. 값이 있으면 SMTP 대신 Brevo 로 발송한다.

mail:
  subject: "박순만 연락처 정보입니다"
  # 명함 위에 들어가는 인사말. 한 줄씩 적으면 그대로 줄바꿈된다.
  greeting:
    - "안녕하세요. 반갑습니다. 박순만입니다."
    - "제 간단한 연락처 정보는 아래와 같습니다."
    - "앞으로 소통하시면서 좋은 관계 유지하기를 희망합니다."
    - "감사합니다."

# 발송 횟수 제한. 시크릿이 유출되더라도 피해 규모를 한정한다.
limits:
  per_recipient_per_hour: 5   # 같은 주소로 시간당 최대 발송 수
  total_per_hour: 50          # 전체 시간당 최대 발송 수
  total_per_day: 100           # 전체 하루 최대 발송 수

bot:
  trigger_phrase: "내 명함 정보 보내줘"
  port: 5000
